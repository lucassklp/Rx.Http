name: Build, Test and Publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        source-url: https://nuget.pkg.github.com/lucassklp/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Install dependencies
      run: dotnet restore

    - name: Test net8.0
      run: dotnet test --framework net8.0 --collect:"XPlat Code Coverage" --results-directory ./TestResults/net8.0 --no-restore --verbosity normal

    - name: Test net10.0
      run: dotnet test --framework net10.0 --collect:"XPlat Code Coverage" --results-directory ./TestResults/net10.0 --no-restore --verbosity normal

    - name: Moving test coverage results to root folder
      run: |
        cp TestResults/net8.0/**/coverage.cobertura.xml ./coverage.net8.0.cobertura.xml
        cp TestResults/net10.0/**/coverage.cobertura.xml ./coverage.net10.0.cobertura.xml

    - name: Send test coverage to Codacy
      uses: codacy/codacy-coverage-reporter-action@v1
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.net8.0.cobertura.xml,coverage.net10.0.cobertura.xml

    - name: Pack
      run: |
        dotnet pack -c Release -o .

    - name: Push Rx.Http to GitHub registry
      run: |
        dotnet nuget push "*.nupkg" -k ${{ secrets.GITHUB_TOKEN }} -s https://nuget.pkg.github.com/lucassklp/index.json --skip-duplicate

    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push Rx.Http to NuGet registry
      run: |
        dotnet nuget push "*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
