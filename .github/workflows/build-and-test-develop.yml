name: Build and Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test net8.0
      run: dotnet test --framework net8.0 --collect:"XPlat Code Coverage" --results-directory ./TestResults/net8.0 --no-restore --verbosity normal

    - name: Test net10.0
      run: dotnet test --framework net10.0 --collect:"XPlat Code Coverage" --results-directory ./TestResults/net10.0 --no-restore --verbosity normal

    - name: Moving test coverage results to root folder
      run: |
        cp TestResults/net8.0/**/coverage.cobertura.xml ./coverage.net8.0.cobertura.xml
        cp TestResults/net10.0/**/coverage.cobertura.xml ./coverage.net10.0.cobertura.xml

    - name: Run codacy-coverage-reporter
      uses: codacy/codacy-coverage-reporter-action@v1
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.net8.0.cobertura.xml,coverage.net10.0.cobertura.xml
